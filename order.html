<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Форма заявки на товар или консультацию.">
  <title>Оформление заявки — ShopProject</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-header__logo" href="index.html">ShopProject</a>

      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li><a class="site-nav__link" href="index.html">Главная</a></li>
          <li><a class="site-nav__link" href="catalog.html">Каталог</a></li>
          <li><a class="site-nav__link" href="order.html" aria-current="page">Заявка</a></li>
          <li><a class="site-nav__link" href="contacts.html">Контакты</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <nav class="breadcrumbs" aria-label="Хлебные крошки">
        <a href="index.html">Главная</a> / <span>Заявка</span>
      </nav>
      <h1>Оформление заявки</h1>
      <p class="order-page__product">Выбранный товар: <strong id="selected-product-label">не выбран</strong></p>

      <div class="order-page__form">
        <form class="order-form" id="order-form" action="#" method="post" novalidate>
          <input id="selected-product" name="selected-product" type="hidden">

          <div class="form-field">
            <label for="order-name">Имя</label>
            <input
              id="order-name"
              name="name"
              type="text"
              placeholder="Введите ваше имя"
              minlength="2"
              autocomplete="given-name"
              required
            >
          </div>

          <div class="form-field">
            <label for="order-email">E-mail</label>
            <input
              id="order-email"
              name="email"
              type="email"
              placeholder="example@mail.ru"
              autocomplete="email"
              required
            >
          </div>

          <div class="form-field">
            <label for="order-phone">Телефон</label>
            <input
              id="order-phone"
              name="phone"
              type="tel"
              inputmode="tel"
              placeholder="+7 (900) 000-00-00"
              pattern="^\+7 \(\d{3}\) \d{3}-\d{2}-\d{2}$"
              required
            >
            <small>Формат: +7 (900) 000-00-00</small>
          </div>

          <div class="form-field">
            <label for="order-date">Дата связи</label>
            <input
              id="order-date"
              name="date"
              type="date"
            >
          </div>

          <div class="form-field">
            <label for="order-topic">Тема заявки</label>
            <select id="order-topic" name="topic" required>
              <option value="">Выберите тему</option>
              <option value="product">Заказ товара</option>
              <option value="consultation">Консультация</option>
              <option value="delivery">Доставка</option>
            </select>
          </div>

          <div class="form-field">
            <label for="order-comment">Комментарий</label>
            <textarea
              id="order-comment"
              name="comment"
              rows="4"
              placeholder="Укажите дополнительную информацию"
            ></textarea>
          </div>

          <div class="form-field form-field--checkbox">
            <label>
              <input
                id="order-agreement"
                name="agreement"
                type="checkbox"
                required
              >
              Я согласен на обработку данных
            </label>
          </div>

          <div class="form-actions">
            <button class="button" type="submit">Отправить заявку</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p class="site-footer__text">&copy; 2026 ShopProject. Учебный проект.</p>
      <p class="site-footer__text">Дисциплина: Фронтенд и бэкенд разработка</p>
    </div>
  </footer>

  <p class="success-message" id="success-message" role="status" hidden>
    Форма успешно отправлена!
  </p>
</body>
</html>
